<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Pogoda Kg</title>
  <meta name="description" content="The page you are looking for does not exist on Pogoda Kg.">
  <meta name="theme-color" content="#FF9F43">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .error-page {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .error-code {
      font-size: 120px;
      font-weight: 800;
      background: linear-gradient(135deg, #FF9F43, #F7B731);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 16px;
    }
    .error-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 12px;
    }
    .error-desc {
      font-size: 16px;
      color: var(--text-sub);
      max-width: 480px;
      margin-bottom: 32px;
    }
    .error-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #FF9F43, #F7B731);
      color: #0f172a;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .error-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 159, 67, 0.35);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-container">
      <a href="/" class="brand-logo" aria-label="Pogoda.kg Home">
        <img src="/assets/logo-dark.png" alt="Pogoda.kg Logo" class="brand-logo-img logo-light-theme">
        <img src="/assets/logo.png" alt="Pogoda.kg Logo" class="brand-logo-img logo-dark-theme">
      </a>
      <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle Navigation Menu">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
    </div>

    <!-- Mobile Navigation Drawer -->
    <div class="mobile-drawer" id="mobileDrawer">
      <nav class="mobile-nav">
        <ul>
          <li><a href="/" data-i18n="nav_home">Home</a></li>
          <li><a href="/blog" data-i18n="nav_news">News</a></li>
          <li><a href="/map" data-i18n="nav_map">Map</a></li>
          <li><a href="/contact" data-i18n="nav_contact">Contact</a></li>
        </ul>
      </nav>
      <div class="mobile-drawer-footer">
        <div class="mobile-lang-title">Language / Тил / Язык</div>
        <div class="lang-selector mobile-lang-selector">
          <button class="lang-btn" data-lang="EN">EN</button>
          <button class="lang-btn" data-lang="KG">KG</button>
          <button class="lang-btn" data-lang="RU">RU</button>
        </div>
      </div>
    </div>
    <div class="mobile-overlay" id="mobileOverlay"></div>
  </header>

  <main class="error-page">
    <div class="error-code">404</div>
    <h1 class="error-title" data-i18n="error_title">Page Not Found</h1>
    <p class="error-desc" data-i18n="error_desc">
      The weather page you're looking for doesn't exist or has been moved. Let's get you back to the forecast.
    </p>
    <a href="/" class="error-btn">
      <i class="fa-solid fa-house"></i> <span data-i18n="error_btn">Back to Weather Home</span>
    </a>
  </main>

  <footer class="site-footer">
    <div class="copyright-bar">
      <div>© 2026 Pogoda Kg (pogoda.kg). All rights reserved.</div>
    </div>
  </footer>

  <script type="module">
    import { applyTranslations, getCurrentLang, initMobileMenu } from '/js/i18n.js';
    document.addEventListener('DOMContentLoaded', () => {
      initMobileMenu();
      applyTranslations(getCurrentLang());
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const targetLang = e.currentTarget.getAttribute('data-lang');
          localStorage.setItem('pogoda_lang', targetLang);
          applyTranslations(targetLang);
          document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-lang') === targetLang));
        });
      });
    });
  </script>
</body>
</html>
