<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 235 44" width="100%" height="100%">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F43"/>
      <stop offset="100%" stop-color="#F7B731"/>
    </linearGradient>
  </defs>

  <!-- Word: Pogoda -->
  <text x="0" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Outfit', sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5" fill="currentColor">
    Pogoda
  </text>

  <!-- Spiral Sun Icon in the middle -->
  <g transform="translate(108, 0) scale(0.44)">
    <!-- Sun Rays -->
    <path fill="none" stroke="url(#sunGrad)" stroke-width="8" stroke-linecap="round" d="
      M 50 14 L 50 24
      M 75 25 L 68 32
      M 86 50 L 76 50
      M 75 75 L 68 68
      M 50 86 L 50 76
      M 25 75 L 32 68
      M 14 50 L 24 50
      M 25 25 L 32 32
    "/>
    <!-- Spiral Center -->
    <path fill="none" stroke="url(#sunGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="
      M 46 51
      C 45 44, 54 44, 55 49
      C 57 56, 42 57, 42 48
      C 42 37, 60 37, 61 50
      C 62 62, 38 62, 38 49
    "/>
  </g>

  <!-- Orange Dot and Kg -->
  <text x="156" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Outfit', sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5" fill="currentColor">
    <tspan fill="#FF9F43">.</tspan><tspan fill="#FF9F43">kg</tspan>
  </text>
</svg>
