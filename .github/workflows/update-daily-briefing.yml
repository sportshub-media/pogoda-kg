name: Publish daily weather updates

on:
  schedule:
    # 09:20 Asia/Bishkek (UTC+6), every day.
    - cron: '20 3 * * *'
    # TEMPORARY one-off test: 12:07 UTC on 26 Sept only (matches again next year). Safe to delete.
    - cron: '7 12 26 9 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/update-daily-briefing.mjs
      - run: node scripts/publish-daily-forecast.mjs
      - name: Commit and push if changed
        run: |
          if ! git diff --quiet; then
            git config user.name 'Pogoda Kg updater'
            git config user.email 'bot@pogoda.kg'
            git add src/js/daily-briefing-data.js src/js/blog-posts-data.js src/blog
            git commit -m 'data: publish daily weather update'
            git push
          fi
      # Best-effort: a failure here (e.g. IndexNow briefly down) must never fail the daily publish.
      - name: Notify IndexNow (Bing, Yandex)
        continue-on-error: true
        run: |
          DAY=$(TZ=Asia/Bishkek date +%F)
          node scripts/indexnow.mjs --ready "/blog/daily-weather-forecast-kyrgyzstan-$DAY" \
            "/blog/daily-weather-forecast-kyrgyzstan-$DAY" /daily /ru/daily /en/daily /blog
