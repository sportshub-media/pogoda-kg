name: Publish daily weather updates

on:
  schedule:
    # 09:20 Asia/Bishkek (UTC+6), every day.
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/update-daily-briefing.mjs
      - run: node scripts/publish-daily-forecast.mjs
      - run: git diff --quiet || (git config user.name 'Pogoda Kg updater' && git config user.email 'bot@pogoda.kg' && git add src/js/daily-briefing-data.js src/js/blog-posts-data.js src/blog && git commit -m 'data: publish daily weather update' && git push)
